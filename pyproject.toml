[project]
name = "ai-video-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "brijmohan-dev", email = "brijmohan11.1996@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "chromadb>=0.5.5",
    "deep-translator>=1.11.4",
    "faster-whisper>=1.0.3",
    "ffmpeg-python>=0.2.0",
    "fpdf2>=2.7.9",
    "langchain>=0.3.0",
    "langchain-chroma>=0.1.4",
    "langchain-community>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-huggingface>=0.1.0",
    "langchain-ollama>=0.2.0",
    "langchain-text-splitters>=0.3.0",
    "moviepy>=1.0.3",
    "numpy>=1.26.4",
    "ollama>=0.3.3",
    "openai-whisper>=20231117",
    "pandas>=2.2.2",
    "pydub>=0.25.1",
    "python-docx>=1.1.2",
    "python-dotenv>=1.0.1",
    "reportlab>=4.2.2",
    "sacremoses>=0.1.1",
    "sentence-transformers>=3.0.1",
    "sentencepiece>=0.2.0",
    "streamlit>=1.38.0",
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "torchvision>=0.29.0",
    "tqdm>=4.66.5",
    "transformers>=4.44.0",
    "yt-dlp>=2024.8.6",
]

[project.scripts]
ai-video-assistant = "ai_video_assistant:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
